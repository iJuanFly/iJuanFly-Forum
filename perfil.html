<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="profile_page_title">Perfil de Usuario - iJuanFly Community Post</title>
    <link rel="stylesheet" href="Estilos.css">
    <style>
        /* LAYOUT GENERAL DEL PERFIL */
        .perfil-layout-grid {
            display: flex;
            flex-direction: column;
            gap: 25px;
            max-width: 1050px;
            margin: 30px auto;
            padding: 0 15px;
            box-sizing: border-box;
            align-items: center;
        }

        .perfil-superior-grid {
            display: flex;
            gap: 25px;
            width: 100%;
            align-items: flex-start;
            justify-content: center;
        }

        .perfil-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            width: 550px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            flex-shrink: 0;
        }

        /* SECCION LATERAL DE LOS ULTIMOS POSTS */
        .perfil-sidebar-posts {
            width: 320px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
        }

            .perfil-sidebar-posts h3 {
                color: #ff4d4d;
                font-size: 1.1rem;
                margin-top: 0;
                margin-bottom: 15px;
                border-bottom: 1px solid #333;
                padding-bottom: 8px;
                text-align: left;
            }

        .post-reciente-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            text-decoration: none;
            display: block;
            color: #fff;
            transition: background 0.2s, border-color 0.2s;
            text-align: left;
        }

            .post-reciente-item:hover {
                background: rgba(255, 255, 255, 0.08);
                border-color: #ff4d4d;
            }

        .post-reciente-titulo {
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }

        .post-reciente-estrellas {
            font-size: 0.85rem;
            color: #ffd700;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* SECCION DE REPUTACION ABAJO */
        .reputacion-seccion-contenedor {
            width: 100%;
            max-width: 895px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px;
            box-sizing: border-box;
        }

            .reputacion-seccion-contenedor h3 {
                color: #ff4d4d;
                font-size: 1.2rem;
                margin-top: 0;
                border-bottom: 1px solid #333;
                padding-bottom: 10px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

        .reputacion-resumen-bar {
            display: flex;
            gap: 20px;
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .rep-badge-pos {
            color: #2ecc71;
            background: rgba(46, 204, 113, 0.1);
            border: 1px solid rgba(46, 204, 113, 0.3);
            padding: 4px 10px;
            border-radius: 6px;
        }

        .rep-badge-neg {
            color: #ff4d4d;
            background: rgba(255, 77, 77, 0.1);
            border: 1px solid rgba(255, 77, 77, 0.3);
            padding: 4px 10px;
            border-radius: 6px;
        }

        .form-dejar-reputacion {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

            .form-dejar-reputacion select, .form-dejar-reputacion textarea {
                background: #181818;
                border: 1px solid #444;
                color: #fff;
                padding: 10px;
                border-radius: 6px;
                font-family: inherit;
                box-sizing: border-box;
            }

            .form-dejar-reputacion textarea {
                resize: vertical;
                min-height: 70px;
            }

        .btn-enviar-rep {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            align-self: flex-end;
            transition: background 0.2s;
        }

            .btn-enviar-rep:hover {
                background-color: #cc0000;
            }

        .lista-opiniones-rep {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .opinion-card-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 12px 15px;
            position: relative;
        }

        .opinion-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .btn-eliminar-opinion {
            background: rgba(255, 77, 77, 0.1);
            border: 1px solid rgba(255, 77, 77, 0.3);
            color: #ff4d4d;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-left: 10px;
        }

            .btn-eliminar-opinion:hover {
                background: #ff4d4d;
                color: #fff;
            }

        .btn-amigo-flotante {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #444;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

            .btn-amigo-flotante:hover {
                background: rgba(255, 77, 77, 0.15);
                border-color: #ff4d4d;
                transform: scale(1.08);
            }

            .btn-amigo-flotante svg {
                width: 22px;
                height: 22px;
                fill: #ccc;
                transition: fill 0.2s;
            }

            .btn-amigo-flotante:hover svg {
                fill: #ff4d4d;
            }

            .btn-amigo-flotante.aceptado {
                background: rgba(46, 204, 113, 0.1);
                border-color: #2ecc71;
            }

                .btn-amigo-flotante.aceptado svg {
                    fill: #2ecc71;
                }

            .btn-amigo-flotante::after {
                content: attr(data-tooltip);
                position: absolute;
                right: 55px;
                top: 50%;
                transform: translateY(-50%);
                background: #181818;
                color: #fff;
                padding: 5px 10px;
                border-radius: 6px;
                font-size: 0.75rem;
                white-space: nowrap;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.2s ease;
                border: 1px solid #444;
                box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            }

            .btn-amigo-flotante:hover::after {
                opacity: 1;
            }

        .avatar-perfil {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ff4d4d;
            background-color: #222;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(255, 77, 77, 0.3);
        }

        .nombre-perfil {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            font-family: inherit !important;
        }

        .rol-holografico {
            background: linear-gradient(90deg, #ff0000, #ff7300, #ffeb00, #1eff00, #00ffff, #002bff, #7a00ff, #ff00aa, #ff0000);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: hologramaAnim 6s ease infinite;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        @keyframes hologramaAnim {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .rol-creador-glow {
            color: #ffffff !important;
            border-color: rgba(255, 255, 255, 0.6) !important;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 15px rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .rol-perfil {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bio-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed #444;
            padding: 15px;
            border-radius: 8px;
            color: #ccc;
            font-size: 0.95rem;
            margin-bottom: 20px;
            word-break: break-word;
            min-height: 40px;
            text-align: left;
            white-space: pre-wrap;
        }

        .enlace-web {
            display: inline-block;
            margin-bottom: 20px;
            color: #00DDFF;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: bold;
        }

            .enlace-web:hover {
                text-decoration: underline;
            }

        .detalles-perfil {
            border-top: 1px solid #333;
            padding-top: 20px;
            display: flex;
            justify-content: space-around;
            color: #aaa;
            font-size: 0.95rem;
        }

        .detalle-item span {
            color: #fff;
            display: block;
            margin-top: 5px;
            font-weight: bold;
        }

        .btn-volver {
            display: inline-block;
            margin-top: 25px;
            background-color: #333;
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            transition: background 0.2s;
            border: 1px solid #555;
        }

            .btn-volver:hover {
                background-color: #444;
            }

        .navbar {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            box-sizing: border-box;
        }

        .selector-idioma {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 6px;
            font-family: Arial, sans-serif !important;
            cursor: pointer;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.2s;
        }

            .selector-idioma:hover {
                border-color: #ff4d4d;
                background: rgba(255, 77, 77, 0.1);
            }

            .selector-idioma option {
                background: #181818;
                color: #fff;
            }

        @media(max-width: 950px) {
            .perfil-superior-grid {
                flex-direction: column;
                align-items: center;
            }

            .perfil-card, .perfil-sidebar-posts {
                width: 100%;
                max-width: 550px;
            }
        }
    </style>
</head>

    <header class="banner">
        <h1>
            <span style="color: red;">iJuanFly</span> <span style="color: #ffffff;">Community Post</span>
        </h1>
        <p data-i18n="sub_banner">Portal Oficial de la Comunidad</p>
    </header>

    <nav class="navbar">
        <ul>
            <li class="dropdown"><a href="Index.html" data-i18n="nav_portal">Portal</a></li>
            <li class="dropdown"><a href="Foro.html" data-i18n="nav_forum">Foro</a></li>
            <li class="dropdown"><a href="#" data-i18n="nav_games">Juegos</a></li>
            <li class="dropdown">
                <a href="#" data-i18n="nav_members">Miembros</a>
                <div class="dropdown-content">
                    <a href="Miembros.html" data-i18n="nav_members_list">Lista de Miembros</a>
                    <a href="cp.html" id="menu-cp" style="display: none; color: #ff4d4d; font-weight: bold;" data-i18n="nav_my_panel">Mi Panel</a>
                    <a href="#" id="menu-salir" onclick="cerrarSesionGlobal()" style="display: none; color: #ff6b6b;" data-i18n="nav_logout">Cerrar Sesion</a>
                </div>
            </li>
        </ul>

        <div class="selector-idioma-container">
            <select id="select-idioma" class="selector-idioma" onchange="cambiarIdiomaGlobal(this.value)">
                <option value="es">ES - Espanol</option>
                <option value="en">EN - English</option>
                <option value="pt">PT - Portugues</option>
                <option value="ru">RU - Русский</option>
                <option value="ja">JA - 日本語</option>
                <option value="zh">ZH - 繁體中文</option>
            </select>
        </div>
    </nav>

    <main class="contenido">
        <div class="perfil-layout-grid">
            <div class="perfil-superior-grid">
                <!-- TARJETA PRINCIPAL DEL PERFIL -->
                <div id="contenedor-perfil">
                    <p style="text-align: center; color: #aaa; margin-top: 50px;" data-i18n="loading_profile">Cargando perfil...</p>
                </div>

                <!-- SIDEBAR LATERAL CON LOS ULTIMOS 3 POSTS -->
                <div class="perfil-sidebar-posts">
                    <h3 data-i18n="sidebar_recent_posts">📝 Ultimos Posts</h3>
                    <div id="contenedor-ultimos-posts">
                        <p style="color: #777; font-size: 0.85rem;" data-i18n="loading_posts">Cargando posts...</p>
                    </div>
                </div>
            </div>

            <!-- SECCION DE REPUTACION Y OPINIONES (SE OCULTARA SI ESTA BANEADO) -->
            <div class="reputacion-seccion-contenedor" id="seccion-reputacion-general">
                <h3 data-i18n="reputation_title">⭐ Reputacion y Opiniones</h3>
                <div class="reputacion-resumen-bar" id="resumen-reputacion">
                    <span class="rep-badge-pos">Positivas: <span id="count-pos">0</span></span>
                    <span class="rep-badge-neg">Negativas: <span id="count-neg">0</span></span>
                </div>

                <!-- Formulario para dejar opinion -->
                <div class="form-dejar-reputacion" id="form-reputacion-box" style="display: none;">
                    <label style="color: #ccc; font-size: 0.9rem;" data-i18n="leave_opinion_label">Dejar una opinion sobre este usuario:</label>
                    <select id="select-tipo-rep">
                        <option value="positivo" data-i18n="opt_positive">👍 Valoracion Positiva</option>
                        <option value="negativo" data-i18n="opt_negative">👎 Valoracion Negativa</option>
                    </select>
                    <textarea id="input-comentario-rep" placeholder="Escribe un comentario opcional..." data-i18n-placeholder="placeholder_rep" maxlength="250"></textarea>
                    <button class="btn-enviar-rep" onclick="enviarReputacion()" data-i18n="btn_submit_rep">Enviar Opinion</button>
                </div>

                <div class="lista-opiniones-rep" id="contenedor-opiniones">
                    <p style="color: #777; font-size: 0.9rem;" data-i18n="loading_opinions">Cargando opiniones...</p>
                </div>
            </div>
        </div>
    </main>

                function formatearUltimaConexion(fechaIso, ocultarUltimavez, esAmigoOPropietario) {
                    const lang = obtenerIdiomaActual();
                    const t = ZEO_TRADUCCIONES[lang] || ZEO_TRADUCCIONES.es;
                    if (ocultarUltimavez && !esAmigoOPropietario) return { texto: t.hidden_text, enLinea: false };
                    if (!fechaIso) return { texto: t.offline, enLinea: false };
                    const ahora = new Date();
                    const ultimaConexion = new Date(fechaIso);
                    const segundosDiferencia = Math.floor((ahora - ultimaConexion) / 1000);
                    if (segundosDiferencia < 300) return { texto: t.status_online, enLinea: true };
                    const minutos = Math.floor(segundosDiferencia / 60);
                    if (minutos < 60) return { texto: t.min_ago(minutos), enLinea: false };
                    const horas = Math.floor(minutos / 60);
                    if (horas < 24) return { texto: t.h_ago(horas), enLinea: false };
                    const dias = Math.floor(horas / 24);
                    if (dias < 7) return { texto: t.d_ago(dias), enLinea: false };
                    return { texto: ultimaConexion.toLocaleDateString(), enLinea: false };
                }

                            usuario_perfil_id: perfilUserId,
                            usuario_autor_id: miIdSesion,
                            tipo: tipo,
                            comentario: comentario
                        }]);

                    if (!error) {
                        document.getElementById('input-comentario-rep').value = '';
                        cargarReputacionUsuario(perfilUserId, miIdSesion, false);
                    } else {
                        alert('Error al enviar opinion: ' + error.message);
                    }
                }

                async function eliminarOpinion(idOpinion) {
                    if (!confirm("¿Estas seguro de que deseas eliminar esta opinion de reputacion?")) return;

                    const { error } = await _supabase
                        .from('Reputacion_Usuarios')
                        .delete()
                        .eq('id', idOpinion);

                    if (!error) {
                        cargarReputacionUsuario(perfilUserId, miIdSesion, false);
                    } else {
                        alert("Error al eliminar la opinion: " + error.message);
                    }
                }

                async function enviarSolicitud(miId, amigoId) {
                    const { error } = await _supabase.from('Amistades').insert([{ usuario_id: miId, amigo_id: amigoId, estado: 'pendiente' }]);
                    if (!error) location.reload();
                    else alert('Error: ' + error.message);
                }

                async function aceptarSolicitud(relacionId) {
                    const { error } = await _supabase.from('Amistades').update({ estado: 'aceptado' }).eq('id', relacionId);
                    if (!error) location.reload();
                    else alert('Error: ' + error.message);
                }

                function escaparHtml(str) {
                    if (!str) return '';
                    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                }

                cargarDatosPerfil();
    </script>
