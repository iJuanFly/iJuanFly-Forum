    <title data-i18n="dm_page_title">Mensajes Privados - iJuanFly Community Post</title>
    <link rel="stylesheet" href="Estilos.css">

    <style>
        .dm-layout {
            display: flex;
            gap: 20px;
            max-width: 1050px;
            height: 75vh;
            margin: 30px auto;
            padding: 0 15px;
            box-sizing: border-box;
        }

        /* EFECTO HOLOGRAFICO PARA EL ROL DE CREADOR */
        .rol-holografico {
            background: linear-gradient(90deg, #ff0000, #ff7300, #ffeb00, #1eff00, #00ffff, #002bff, #7a00ff, #ff00aa, #ff0000);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: hologramaAnim 6s ease infinite;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        @keyframes hologramaAnim {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .dm-sidebar {
            width: 320px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

            .dm-sidebar h3 {
                color: #ff4d4d;
                font-size: 0.95rem;
                border-bottom: 1px solid #333;
                padding-bottom: 6px;
                margin-bottom: 0;
            }

        /* BARRA DE BUSQUEDA (LUPA) EN SIDEBAR */
        .search-bar-dm {
            position: relative;
        }

            .search-bar-dm input {
                width: 100%;
                background: #1a1a1a;
                border: 1px solid #444;
                padding: 8px 12px 8px 34px;
                border-radius: 6px;
                color: #fff;
                font-family: inherit;
                font-size: 0.9rem;
                box-sizing: border-box;
                outline: none;
            }

                .search-bar-dm input:focus {
                    border-color: #ff4d4d;
                }

            .search-bar-dm svg {
                position: absolute;
                left: 10px;
                top: 50%;
                transform: translateY(-50%);
                width: 15px;
                height: 15px;
                fill: #777;
            }

        .dm-contacto-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #333;
            border-radius: 6px;
            text-decoration: none;
            color: #fff;
            transition: background 0.2s;
            position: relative;
        }

            .dm-contacto-item:hover, .dm-contacto-item.activo {
                background: rgba(255, 77, 77, 0.15);
                border-color: #ff4d4d;
            }

        .avatar-container {
            position: relative;
            flex-shrink: 0;
        }

        .dm-contacto-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #ff4d4d;
            display: block;
        }

        /* PUNTO VERDE DE EN LINEA */
        .estado-punto {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid #181818;
        }

        .punto-online {
            background-color: #00B028;
            box-shadow: 0 0 6px #00B028;
        }

        .punto-offline {
            background-color: #666;
        }

        .dm-contacto-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex: 1;
            white-space: nowrap;
        }

        .dm-chat-box {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .dm-chat-header {
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 12px;
        }

            .dm-chat-header img {
                width: 40px;
                height: 40px;
                border-radius: 50%;
                object-fit: cover;
                border: 2px solid #ff4d4d;
            }

        .dm-mensajes-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .mensaje-burbuja {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 8px;
            word-break: break-word;
            position: relative;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .mensaje-propio {
            background: rgba(255, 77, 77, 0.2);
            border: 1px solid rgba(255, 77, 77, 0.4);
            align-self: flex-end;
            color: #fff;
            border-top-right-radius: 2px;
        }

        .mensaje-ajeno {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            align-self: flex-start;
            color: #ddd;
            border-top-left-radius: 2px;
        }

        .mensaje-burbuja img, .mensaje-burbuja video {
            max-width: 280px;
            max-height: 250px;
            border-radius: 6px;
            margin-top: 6px;
            display: block;
            object-fit: cover;
        }

        /* Contenedor del area de input y previsualizacion */
        .dm-input-wrapper {
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.6);
            border-top: 1px solid #333;
        }

        .preview-imagen-container {
            display: none;
            padding: 8px 15px;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #333;
            background: rgba(255, 255, 255, 0.02);
        }

            .preview-imagen-container img, .preview-imagen-container video {
                width: 45px;
                height: 45px;
                object-fit: cover;
                border-radius: 6px;
                border: 1px solid #ff4d4d;
            }

        .btn-quitar-preview {
            background: #ff4d4d;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dm-input-area {
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

            .dm-input-area input[type="text"] {
                flex: 1;
                background: #1a1a1a;
                border: 1px solid #444;
                color: #fff;
                padding: 10px 14px;
                border-radius: 6px;
                font-family: inherit;
                outline: none;
            }

        .btn-enviar-dm {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: background 0.2s;
        }

            .btn-enviar-dm:hover {
                background-color: #cc0000;
            }

        .btn-adjuntar-img {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: background 0.2s;
        }

            .btn-adjuntar-img:hover {
                background: #444;
            }

        .btn-emoji-chat {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            opacity: 0.7;
            transition: transform 0.2s;
        }

            .btn-emoji-chat:hover {
                opacity: 1;
                transform: scale(1.15);
            }

        .emoji-picker-dm {
            display: none;
            position: absolute;
            bottom: 100%;
            right: 20px;
            z-index: 999;
            background: #181818;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            width: 280px;
            max-height: 220px;
            overflow-y: auto;
        }

        .emoji-grid-dm {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .emoji-item-dm {
            font-size: 1.3rem;
            padding: 4px;
            cursor: pointer;
            text-align: center;
            border-radius: 4px;
            user-select: none;
        }

            .emoji-item-dm:hover {
                background: rgba(255, 255, 255, 0.15);
            }

        .navbar {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            box-sizing: border-box;
        }

        .selector-idioma-container {
            position: absolute;
            right: 25px;
            top: 50%;
            transform: translateY(-50%);
        }

        .selector-idioma {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 6px;
            font-family: Arial, sans-serif !important;
            cursor: pointer;
            font-size: 0.85rem;
            outline: none;
        }

            .selector-idioma option {
                background: #181818;
                color: #fff;
            }
    </style>

                try {
                    const raw = localStorage.getItem('usuarioZeoWorks');
                    if (raw) usuarioActual = JSON.parse(raw);
                } catch(e) {}

                if (!usuarioActual) {
                    window.location.href = 'Login.html';
                }

                async function actualizarUltimaConexion() {
                    if (!usuarioActual) return;
                    await _supabase
                        .from('Usuarios')
                        .update({ ultima_conexion: new Date().toISOString() })
                        .eq('id', usuarioActual.id);
                }

                async function inicializarChat() {
                    await actualizarUltimaConexion();
                    setInterval(actualizarUltimaConexion, 30000);

                    const { data: amistades } = await _supabase
                        .from('Amistades')
                        .select('*')
                        .eq('estado', 'aceptado')
                        .or(`usuario_id.eq.${usuarioActual.id},amigo_id.eq.${usuarioActual.id}`);

                    if (amistades && amistades.length > 0) {
                        const idsAmigos = amistades.map(a => a.usuario_id === usuarioActual.id ? a.amigo_id : a.usuario_id);
                        const { data: amigosDb } = await _supabase
                            .from('Usuarios')
                            .select('id, Nombre, Avatar, Rol, ultima_conexion')
                            .in('id', idsAmigos);

                        if (amigosDb) {
                            listaAmigosCache = amigosDb;
                            renderizarAmigosSidebar(listaAmigosCache);
                        }
                    } else {
                        const lang = obtenerIdiomaActual();
                        const t = ZEO_TRADUCCIONES[lang] || ZEO_TRADUCCIONES.es;
                        document.getElementById('lista-conversaciones').innerHTML = `<p style="color: #777; font-size: 0.85rem;">${t.no_friends}</p>`;
                    }

                    if (nombreDestinoParam) {
                        const { data: userExtra } = await _supabase
                            .from('Usuarios')
                            .select('*')
                            .eq('Nombre', nombreDestinoParam)
                            .single();
                        if (userExtra) {
                            usuarioDestino = userExtra;
                            configurarHeaderChat();
                            cargarMensajes();
                            suscripcionTiempoReal();
                        }
                    }

                    aplicarTraduccionesGlobales();
                }

                function renderizarAmigosSidebar(amigos) {
                    const contenedorLista = document.getElementById('lista-conversaciones');
                    if (!amigos || amigos.length === 0) {
                        contenedorLista.innerHTML = `<p style="color: #777; font-size: 0.85rem;">No hay resultados</p>`;
                        return;
                    }

                    const lang = obtenerIdiomaActual();
                    const t = ZEO_TRADUCCIONES[lang] || ZEO_TRADUCCIONES.es;
                    const ahora = new Date();
                    let html = '';

                    amigos.forEach(amigo => {
                        const avatar = amigo.Avatar || avatarPorDefecto;
                        const esActivo = nombreDestinoParam && amigo.Nombre.toLowerCase() === nombreDestinoParam.toLowerCase();

                        let online = false;
                        if (amigo.ultima_conexion) {
                            const diff = (ahora - new Date(amigo.ultima_conexion)) / 1000;
                            if (diff < 60) online = true;
                        }

                        const estiloRol = obtenerEstiloRol(amigo.Rol);
                        const attrRol = estiloRol.tipo === 'class' ? `class="rol-holografico"` : `style="font-weight: bold; ${estiloRol.valor}; font-size: 0.9rem;"`;

                        html += `
                            <a href="dm.html?para=${encodeURIComponent(amigo.Nombre)}" class="dm-contacto-item ${esActivo ? 'activo' : ''}">
                                <div class="avatar-container">
                                    <img src="${avatar}" class="dm-contacto-avatar" alt="Avatar">
                                    <span class="estado-punto ${online ? 'punto-online' : 'punto-offline'}"></span>
                                </div>
                                <div class="dm-contacto-info">
                                    <span ${attrRol} style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${amigo.Nombre}</span>
                                    <span style="font-size: 0.75rem; color: #888;">${online ? t.status_online : t.status_offline}</span>
                                </div>
                            </a>
                        `;
                    });
                    contenedorLista.innerHTML = html;
                }

                function filtrarAmigosSidebar() {
                    const query = document.getElementById('buscador-amigos-dm').value.toLowerCase();
                    const filtrados = listaAmigosCache.filter(a => a.Nombre.toLowerCase().includes(query));
                    renderizarAmigosSidebar(filtrados);
                }

                function configurarHeaderChat() {
                    if (!usuarioDestino) return;
                    document.getElementById('chat-header-avatar').src = usuarioDestino.Avatar || avatarPorDefecto;

                    const headerNombre = document.getElementById('chat-header-nombre');
                    headerNombre.textContent = usuarioDestino.Nombre;
                    const estiloRol = obtenerEstiloRol(usuarioDestino.Rol);
                    if (estiloRol.tipo === 'class') {
                        headerNombre.className = 'rol-holografico';
                        headerNombre.removeAttribute('style');
                    } else {
                        headerNombre.className = '';
                        headerNombre.setAttribute('style', `margin: 0; font-size: 1.1rem; ${estiloRol.valor}`);
                    }

                    const ahora = new Date();
                    let online = false;
                    if (usuarioDestino.ultima_conexion) {
                        const diff = (ahora - new Date(usuarioDestino.ultima_conexion)) / 1000;
                        if (diff < 60) online = true;
                    }
                    const puntoHeader = document.getElementById('chat-header-punto');
                    puntoHeader.className = `estado-punto ${online ? 'punto-online' : 'punto-offline'}`;

                    const lang = obtenerIdiomaActual();
                    const t = ZEO_TRADUCCIONES[lang] || ZEO_TRADUCCIONES.es;
                    document.getElementById('chat-header-estado').textContent = online ? t.status_online : t.status_offline;

                    document.getElementById('input-area').style.display = 'flex';
                }

                async function cargarMensajes() {
                    const contenedor = document.getElementById('mensajes-container');

                    let { data: msgs, error } = await _supabase
                        .from('mensajes')
                        .select('*')
                        .or(`and(remitente_id.eq.${usuarioActual.id},destinatario_id.eq.${usuarioDestino.id}),and(remitente_id.eq.${usuarioDestino.id},destinatario_id.eq.${usuarioActual.id})`)
                        .order('created_at', { ascending: true });

                    if (error) {
                        msgs = [];
                    }

                    if (!msgs || msgs.length === 0) {
                        contenedor.innerHTML = `<p style="color: #777; text-align: center; margin-top: 50px;">Inicia la conversacion con ${usuarioDestino.Nombre}</p>`;
                        return;
                    }

                    let html = '';
                    msgs.forEach(m => {
                        const propio = m.remitente_id === usuarioActual.id;
                        let contenidoHtml = m.mensaje ? `<p style="margin: 0;">${escaparHtml(m.mensaje)}</p>` : '';

                        if (m.imagen) {
                            const esVideo = m.imagen.includes('video/') || m.imagen.endsWith('.mp4') || m.imagen.endsWith('.webm');
                            if (esVideo) {
                                contenidoHtml += `<video src="${m.imagen}" controls style="max-width: 280px; max-height: 250px; border-radius: 6px; margin-top: 6px;"></video>`;
                            } else {
                                contenidoHtml += `<img src="${m.imagen}" onclick="window.open(this.src)" alt="Archivo adjunto">`;
                            }
                        }

                        html += `
                            <div class="mensaje-burbuja ${propio ? 'mensaje-propio' : 'mensaje-ajeno'}">
                                ${contenidoHtml}
                            </div>
                        `;
                    });
                    contenedor.innerHTML = html;
                    contenedor.scrollTop = contenedor.scrollHeight;
                }

                function suscripcionTiempoReal() {
                    _supabase
                        .channel('public:mensajes-dm')
                        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensajes' }, payload => {
                            const nuevo = payload.new;
                            if (usuarioDestino && (
                                (nuevo.remitente_id === usuarioActual.id && nuevo.destinatario_id === usuarioDestino.id) ||
                                (nuevo.remitente_id === usuarioDestino.id && nuevo.destinatario_id === usuarioActual.id)
                            )) {
                                cargarMensajes();
                            }
                        })
                        .subscribe();
                }

                function mostrarPreviewMedia(input) {
                    if (input.files && input.files[0]) {
                        const file = input.files[0];
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            const wrapper = document.getElementById('preview-media-wrapper');
                            wrapper.innerHTML = '';
                            if (file.type.startsWith('video/')) {
                                wrapper.innerHTML = `<video src="${e.target.result}" style="width: 45px; height: 45px; object-fit: cover; border-radius: 6px; border: 1px solid #ff4d4d;"></video>`;
                            } else {
                                wrapper.innerHTML = `<img src="${e.target.result}" alt="Vista previa">`;
                            }
                            document.getElementById('nombre-img-preview').textContent = file.name;
                            document.getElementById('preview-container').style.display = 'flex';
                        }
                        reader.readAsDataURL(file);
                    }
                }

                function quitarMedia() {
                    document.getElementById('input-multimedia-dm').value = '';
                    document.getElementById('preview-container').style.display = 'none';
                    document.getElementById('preview-media-wrapper').innerHTML = '';
                }

                async function enviarMensaje() {
                    const inputTexto = document.getElementById('mensaje-texto');
                    const inputMedia = document.getElementById('input-multimedia-dm');
                    const texto = inputTexto.value.trim();
                    let base64Media = null;

                    if (inputMedia.files && inputMedia.files[0]) {
                        base64Media = await convertirArchivoBase64(inputMedia.files[0]);
                    }

                    if (!texto && !base64Media) return;

                    let { error } = await _supabase.from('mensajes').insert([
                        {
                            remitente_id: usuarioActual.id,
                            destinatario_id: usuarioDestino.id,
                            mensaje: texto,
                            imagen: base64Media
                        }
                    ]);

                    if (error) {
                        alert("Error al enviar mensaje: " + error.message);
                        return;
                    }

                    inputTexto.value = '';
                    quitarMedia();
                    cargarMensajes();
                }

                function convertirArchivoBase64(file) {
                    return new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.readAsDataURL(file);
                        reader.onload = (event) => {
                            if (file.type.startsWith('video/') || file.type === 'image/gif') {
                                resolve(event.target.result);
                            } else {
                                const img = new Image();
                                img.src = event.target.result;
                                img.onload = () => {
                                    const canvas = document.createElement('canvas');
                                    let width = img.width;
                                    let height = img.height;
                                    const maxDim = 800;

                                    if (width > height && width > maxDim) {
                                        height *= maxDim / width;
                                        width = maxDim;
                                    } else if (height > maxDim) {
                                        width *= maxDim / height;
                                        height = maxDim;
                                    }

                                    canvas.width = width;
                                    canvas.height = height;
                                    const ctx = canvas.getContext('2d');
                                    ctx.drawImage(img, 0, 0, width, height);
                                    resolve(canvas.toDataURL('image/jpeg', 0.8));
                                };
                            }
                        };
                    });
                }

                function escaparHtml(str) {
                    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                }

                const listaEmojisChat = ["😀","😃","😄","😁","😆","😅","😂","🤣","🥲","☺️","😊","😇","🙂","🙃","😉","😍","🥰","😘","😋","😛","😜","🤪","🤑","🤗","🤫","🤔","🔥","⭐","🚀","❤️","🖤","💜","👍","👎"];
                const gridEmojisDm = document.getElementById('grid-emojis-dm');
                const pickerEmojisDm = document.getElementById('picker-emojis-dm');
                const btnToggleEmojisDm = document.getElementById('btn-toggle-emojis-dm');
                const inputTexto = document.getElementById('mensaje-texto');

                listaEmojisChat.forEach(emoji => {
                    const span = document.createElement('span');
                    span.className = 'emoji-item-dm';
                    span.textContent = emoji;
                    span.onclick = () => {
                        inputTexto.value += emoji;
                        pickerEmojisDm.style.display = 'none';
                        inputTexto.focus();
                    };
                    gridEmojisDm.appendChild(span);
                });

                btnToggleEmojisDm.onclick = (e) => {
                    e.stopPropagation();
                    pickerEmojisDm.style.display = pickerEmojisDm.style.display === 'block' ? 'none' : 'block';
                };

                document.onclick = (e) => {
                    if (!pickerEmojisDm.contains(e.target) && e.target !== btnToggleEmojisDm) {
                        pickerEmojisDm.style.display = 'none';
                    }
                };

                function cerrarSesionGlobal() {
                    localStorage.removeItem('usuarioZeoWorks');
                    window.location.href = 'Login.html';
                }
    </script>
</body>
